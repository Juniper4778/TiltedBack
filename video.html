<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video | Tilted Back</title>
  <meta name="description" content="Video archive from Tilted Back — live performances and memories.">

  <style>
    :root {
      --bg:#080808;
      --text:#f2f2f2;
      --accent:#d7a43a;
      --line:#252525;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Arial, Helvetica, sans-serif;
      line-height:1.6;
    }

    a {
      color:inherit;
      text-decoration:none;
    }

    .nav {
      position:fixed;
      top:0;
      left:0;
      right:0;
      z-index:10;
      background:rgba(0,0,0,.82);
      backdrop-filter:blur(8px);
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .nav-inner {
      max-width:1100px;
      margin:auto;
      padding:15px 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .brand {
      font-weight:900;
      letter-spacing:4px;
      font-size:18px;
    }

    .links {
      display:flex;
      gap:25px;
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:1.5px;
    }

    .links a:hover {
      color:var(--accent);
    }

    .page {
      max-width:1100px;
      margin:auto;
      padding:150px 22px 80px;
    }

    .eyebrow {
      color:var(--accent);
      text-transform:uppercase;
      letter-spacing:4px;
      font-size:12px;
      font-weight:bold;
      margin-bottom:8px;
    }

    h1 {
      margin:0;
      font-size:clamp(58px, 10vw, 110px);
      line-height:.9;
      letter-spacing:-4px;
      font-weight:900;
      text-transform:uppercase;
    }

    .rule {
      width:70px;
      height:3px;
      background:var(--accent);
      margin:25px 0 50px;
    }

    .video-list {
      display:flex;
      flex-direction:column;
      gap:40px;
    }

    .video-card {
      border:1px solid var(--line);
      background:#111;
      padding:30px;
    }

    .video-placeholder {
      aspect-ratio:16 / 9;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#080808;
      border:1px solid var(--line);
      color:#888;
      text-align:center;
      font-size:16px;
    }

    .video-title {
      margin:22px 0 0;
      font-size:22px;
      font-weight:700;
      letter-spacing:1px;
      text-transform:uppercase;
    }

    @media (max-width:650px) {
      .links {
        gap:12px;
        font-size:11px;
      }

      .brand {
        letter-spacing:2px;
        font-size:15px;
      }

      .page {
        padding:125px 18px 60px;
      }

      h1 {
        letter-spacing:-3px;
      }

      .video-card {
        padding:18px;
      }
    }
  </style>
</head>

<body>

  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">TILTED BACK</a>

      <div class="links">
        <a href="index.html#about">About</a>
        <a href="index.html#band">Band</a>
        <a href="photos.html">Photos</a>
        <a href="video.html">Video</a>
        <a href="index.html#contact">Contact</a>
      </div>
    </div>
  </nav>

  <main class="page">

    <div class="eyebrow">Watch</div>

    <h1>Video</h1>

    <div class="rule"></div>

    <div class="video-list">

      <div class="video-card">
        <div class="video-placeholder">
          Your Tilted Back video will go here.
        </div>

        <div class="video-title">
          Live Performance
        </div>
      </div>

    </div>

  </main>

</body>
</html>
